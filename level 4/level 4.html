      // =========================================================================
      // 13. MAIN 60FPS SIMULATION & RENDER LOOP
      // =========================================================================
      const clock = new THREE.Clock();

      function updateSimulation(dt) {
        const clim = CLIMATES[state.climateIdx];

        // 1. Weather: Angled 3D Rain + Ground Splash Rings + Wind + Ground-Hitting Debris
        const rArr = rainGeo.attributes.position.array;
        for (let i = 0; i < RAIN_COUNT; i++) {
          const idx = i * 6;
          rArr[idx] += clim.windX * dt;
          rArr[idx + 1] -= 21.0 * dt;
          rArr[idx + 2] += clim.windZ * dt;
          if (rArr[idx + 1] < 0) {
            rArr[idx] = playerPos.x + (Math.random() - 0.5) * 52;
            rArr[idx + 1] = 20 + Math.random() * 6;
            rArr[idx + 2] = playerPos.z + (Math.random() - 0.5) * 52;
          }
          rArr[idx + 3] = rArr[idx] - clim.windX * 0.06;
          rArr[idx + 4] = rArr[idx + 1] - 1.25;
          rArr[idx + 5] = rArr[idx + 2] - clim.windZ * 0.06;
        }
        rainGeo.attributes.position.needsUpdate = true;

        for (let i = 0; i < splashRings.length; i++) {
          const sr = splashRings[i];
          sr.phase += dt * 2.8;
          if (sr.phase >= 1.0) {
            sr.phase = 0;
            sr.mesh.position.x = playerPos.x + (Math.random() - 0.5) * 28;
            sr.mesh.position.z = playerPos.z + (Math.random() - 0.5) * 28;
          }
          const s = 0.4 + sr.phase * 1.4;
          sr.mesh.scale.set(s, s, 1);
          sr.mesh.material.opacity = (1.0 - sr.phase) * 0.55;
        }

        const wArr = windGeo.attributes.position.array;
        for (let i = 0; i < WIND_COUNT; i++) {
          const idx = i * 6;
          wArr[idx] += clim.windX * 3.2 * dt;
          wArr[idx + 2] += clim.windZ * 3.2 * dt;
          if (Math.abs(wArr[idx] - playerPos.x) > 28) wArr[idx] = playerPos.x - Math.sign(clim.windX || 1) * 26;
          if (Math.abs(wArr[idx + 2] - playerPos.z) > 28) wArr[idx + 2] = playerPos.z - Math.sign(clim.windZ || 1) * 26;
          wArr[idx + 3] = wArr[idx] + clim.windX * 0.45;
          wArr[idx + 4] = wArr[idx + 1];
          wArr[idx + 5] = wArr[idx + 2] + clim.windZ * 0.45;
        }
        windGeo.attributes.position.needsUpdate = true;

        // Ground-Hitting Debris Physics with Bounce & Impact Spark/Dust Burst
        for (let i = 0; i < debrisField.length; i++) {
          const d = debrisField[i];
          d.phase += dt * d.speed * 2.5;
          d.vy -= 9.8 * dt;
          d.mesh.position.x += (clim.windX * 1.45 + Math.cos(d.phase) * 0.7) * dt;
          d.mesh.position.z += (clim.windZ * 1.45 + Math.sin(d.phase) * 0.7) * dt;
          d.mesh.position.y += d.vy * dt;
          d.mesh.rotation.x += 3.2 * dt;
          d.mesh.rotation.y += 3.6 * dt;

          if (d.mesh.position.y <= 0.06) {
            d.mesh.position.y = 0.06;
            if (Math.abs(d.vy) > 2.2) {
              spawnBurst(d.mesh.position, 2, d.mesh.material.color.getHex());
            }
            d.vy = Math.abs(d.vy) * 0.42 + (clim.tornadoes > 0 ? 3.2 : 0.8);
          }

          if (Math.abs(d.mesh.position.x - playerPos.x) > 24 || Math.abs(d.mesh.position.z - playerPos.z) > 24) {
            d.mesh.position.x = playerPos.x + (Math.random() - 0.5) * 42;
            d.mesh.position.z = playerPos.z + (Math.random() - 0.5) * 42;
            d.mesh.position.y = 5.0 + Math.random() * 6.0;
            d.vy = -1.0;
          }
        }

        // Sway Trees & Flicker Streetlamps
        const elapsed = clock.elapsedTime;
        for (let i = 0; i < swayProps.length; i++) {
          const sp = swayProps[i];
          sp.mesh.rotation.z = Math.sin(elapsed * 2.2 + sp.phase) * sp.factor;
        }
        for (let i = 0; i < flickeringLights.length; i++) {
          const fl = flickeringLights[i];
          fl.light.intensity = 1.6 + Math.sin(elapsed * 14 + fl.phase) * 0.45;
        }

        // Tornado Orbit
        for (let i = 0; i < tornadoes.length; i++) {
          const tor = tornadoes[i];
          if (!tor.group.visible) continue;
          tor.angle += dt * 0.35;
          tor.group.position.x = Math.cos(tor.angle) * tor.radius;
          tor.group.position.z = Math.sin(tor.angle) * tor.radius;
          tor.group.rotation.y += dt * 5.5;
        }

        // Shell Casings, Burst Particles & Bullet Tracers
        for (let i = 0; i < shells.length; i++) {
          const s = shells[i];
          if (s.life > 0) {
            s.life -= dt;
            s.vy -= 9.8 * dt;
            s.mesh.position.x += s.vx * dt;
            s.mesh.position.y += s.vy * dt;
            s.mesh.position.z += s.vz * dt;
            s.mesh.rotation.x += 12 * dt;
            if (s.life <= 0) s.mesh.visible = false;
          }
        }
        for (let i = 0; i < burstPool.length; i++) {
          const p = burstPool[i];
          if (p.life > 0) {
            p.life -= dt;
            p.vy -= 9.5 * dt;
            p.mesh.position.x += p.vx * dt;
            p.mesh.position.y += p.vy * dt;
            p.mesh.position.z += p.vz * dt;
            if (p.life <= 0) p.mesh.visible = false;
          }
        }
        for (let i = 0; i < tracerBolts.length; i++) {
          const t = tracerBolts[i];
          if (t.life > 0) {
            t.life -= dt;
            t.mesh.material.opacity = Math.max(0, (t.life / t.maxLife) * 0.95);
            if (t.life <= 0) t.mesh.visible = false;
          }
        }
        if (muzzleFlashTimer > 0) {
          muzzleFlashTimer -= dt;
          if (muzzleFlashTimer <= 0) muzzleFlashGroup.visible = false;
        }

        if (!state.running) return;

        // 2. 3-2-1 Darkness Countdown
        if (state.countdown > 0) {
          const prevCeil = Math.ceil(state.countdown);
          state.countdown -= dt;
          const curCeil = Math.ceil(state.countdown);
          if (curCeil !== prevCeil && curCeil >= 1) {
            countdownNum.textContent = String(curCeil);
            audio.playCountdownTick(curCeil);
          }
          if (state.countdown <= 0) {
            countdownOverlay.style.display = 'none';
          }
        }

        // Random Climate Shifts & Lightning Thunderstorms
        state.climateTimer -= dt;
        if (state.climateTimer <= 0) {
          state.climateTimer = 18 + Math.random() * 12;
          applyClimate(state.climateIdx + 1);
        }

        state.lightningTimer -= dt;
        if (state.lightningTimer <= 0) {
          state.lightningTimer = 4.5 + Math.random() * 6.5;
          const bx = playerPos.x + (Math.random() - 0.5) * 48;
          const bz = playerPos.z + (Math.random() - 0.5) * 48;
          const bArr = lightningBolt.geometry.attributes.position.array;
          for (let j = 0; j < 10; j++) {
            bArr[j * 3] = bx + (Math.random() - 0.5) * 2.5;
            bArr[j * 3 + 1] = j * 3.2;
            bArr[j * 3 + 2] = bz + (Math.random() - 0.5) * 2.5;
          }
          lightningBolt.geometry.attributes.position.needsUpdate = true;
          lightningBolt.visible = true;
          flashOverlay.style.opacity = '0.65';
          audio.playSpatialThunder(bx, bz);
          setTimeout(() => {
            lightningBolt.visible = false;
            flashOverlay.style.opacity = '0';
          }, 110);
        }

        // 3. Player Movement, Jump Physics & Solid AABB Collider Resolution
        if (keys['KeyQ']) state.yaw += 1.9 * dt * state.lookSens;
        if (keys['KeyE']) state.yaw -= 1.9 * dt * state.lookSens;

        let moveForward = (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0) - (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0) - joyVec.y;
        let moveRight = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0) + joyVec.x;
        const mLen = Math.hypot(moveForward, moveRight);
        if (mLen > 1) {
          moveForward /= mLen;
          moveRight /= mLen;
        }

        const speed = state.zoomed ? 4.2 : 6.4;
        const sinY = Math.sin(state.yaw);
        const cosY = Math.cos(state.yaw);
        const vx = (-sinY * moveForward + cosY * moveRight) * speed;
        const vz = (-cosY * moveForward - sinY * moveRight) * speed;

        playerPos.x += vx * dt;
        playerPos.z += vz * dt;
        resolveCircleColliders(playerPos, 0.55);

        state.vy -= 15.5 * dt;
        playerPos.y += state.vy * dt;
        if (playerPos.y <= 1.68) {
          playerPos.y = 1.68;
          state.vy = 0;
          state.onGround = true;
        }

        if (mLen > 0.15 && state.onGround) {
          state.bobTime += dt * 10.5;
          state.stepAccum += dt;
          if (state.stepAccum >= 0.42) {
            state.stepAccum = 0;
            audio.playFootstep();
          }
        }

        // Battery Drain & Hand-Crank Recharge
        if (keys['KeyF'] || touchCrankHeld) {
          state.battery = Math.min(100, state.battery + 28 * dt * state.btnSens);
        } else {
          state.battery = Math.max(8, state.battery - 1.35 * dt);
        }
        flashLight.intensity = (state.battery / 100) * 2.6;

        // Reload & Automatic Fire Hold
        if (state.fireCooldown > 0) state.fireCooldown -= dt;
        if ((touchFireHeld || mouseDragging) && PISTOLS[state.weaponIdx].id === 'AUTO-9') {
          firePistol();
        }
        if (state.reloading) {
          state.reloadTimer -= dt;
          if (state.reloadTimer <= 0) {
            const needed = state.maxAmmo - state.ammo;
            const take = Math.min(needed, state.reserveAmmo);
            state.ammo += take;
            state.reserveAmmo -= take;
            state.reloading = false;
            updateHUD();
          }
        }

        // Smooth FOV Scope Zoom & Viewmodel Recoil
        const targetFov = state.zoomed ? PISTOLS[state.weaponIdx].zoomFov : 74;
        camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 14);
        camera.updateProjectionMatrix();

        state.recoil = Math.max(0, state.recoil - dt * 2.2);
        if (muzzleLight.intensity > 0) muzzleLight.intensity = Math.max(0, muzzleLight.intensity - dt * 38);

        const targetGunX = state.zoomed ? 0.0 : 0.22;
        const targetGunY = state.zoomed ? -0.145 : -0.22;
        gunGroup.position.x += (targetGunX - gunGroup.position.x) * Math.min(1, dt * 14);
        gunGroup.position.y += (targetGunY - gunGroup.position.y) * Math.min(1, dt * 14);
        gunGroup.position.z = -0.42 + state.recoil * 0.14;
        slideMesh.position.z = -0.02 + state.recoil * 0.08;

        const bobOffsetY = Math.sin(state.bobTime) * 0.055;
        const bobOffsetX = Math.cos(state.bobTime * 0.5) * 0.032;
        const shakeX = state.screenShake > 0 ? (Math.random() - 0.5) * state.screenShake : 0;
        const shakeY = state.screenShake > 0 ? (Math.random() - 0.5) * state.screenShake : 0;
        if (state.screenShake > 0) state.screenShake = Math.max(0, state.screenShake - dt * 0.3);

        playerRig.position.set(
          playerPos.x + bobOffsetX + shakeX,
          playerPos.y + bobOffsetY + shakeY,
          playerPos.z
        );
        if (!renderer.xr.isPresenting) {
          camera.position.set(0, 0, 0);
          camera.rotation.order = 'YXZ';
          camera.rotation.y = state.yaw;
          camera.rotation.x = state.pitch + state.recoil * 0.055;
        } else {
          // Quest 2/3 WebXR Thumbstick Locomotion & Trigger Fire
          const session = renderer.xr.getSession();
          if (session && session.inputSources) {
            for (const src of session.inputSources) {
              if (!src.gamepad) continue;
              const axes = src.gamepad.axes;
              if (axes && axes.length >= 4) {
                if (src.handedness === 'left') {
                  playerPos.x += (-Math.sin(state.yaw) * -axes[3] + Math.cos(state.yaw) * axes[2]) * 4.8 * dt;
                  playerPos.z += (-Math.cos(state.yaw) * -axes[3] - Math.sin(state.yaw) * axes[2]) * 4.8 * dt;
                  resolveCircleColliders(playerPos, 0.55);
                } else if (src.handedness === 'right') {
                  state.yaw -= axes[2] * 1.8 * dt;
                }
              }
              if (src.gamepad.buttons[0] && src.gamepad.buttons[0].pressed) {
                firePistol();
              }
            }
          }
        }

        audio.updateListener(playerPos, state.yaw);
        audio.setAmbience(0.05 * clim.rain, 0.04, 0.05);

        // 4. Pickups Collection
        for (let i = 0; i < pickups.length; i++) {
          const p = pickups[i];
          if (!p.active) {
            p.respawnTimer -= dt;
            if (p.respawnTimer <= 0) {
              p.active = true;
              p.mesh.visible = true;
            }
            continue;
          }
          p.mesh.rotation.y += dt * 1.8;
          if (Math.hypot(p.mesh.position.x - playerPos.x, p.mesh.position.z - playerPos.z) < 1.35) {
            p.active = false;
            p.mesh.visible = false;
            p.respawnTimer = 14;
            if (p.type === 'AMMO') {
              state.reserveAmmo += state.maxAmmo * 2;
            } else {
              state.battery = 100;
              state.hp = Math.min(100, state.hp + 25);
            }
            audio.playReload();
            updateHUD();
          }
        }

        // 5. Stalker AI, Weeping-Angel Freeze, Spatial Footsteps & Directional Damage
        let nearestDist = 999;
        const lookDirX = -Math.sin(state.yaw);
        const lookDirZ = -Math.cos(state.yaw);

        for (let i = 0; i < enemies.length; i++) {
          const en = enemies[i];
          if (!en.alive) {
            if (state.countdown <= 0) {
              en.respawnTimer -= dt;
              if (en.respawnTimer <= 0) spawnEnemyAtPerimeter(en);
            }
            continue;
          }

          const dx = playerPos.x - en.root.position.x;
          const dz = playerPos.z - en.root.position.z;
          const dist = Math.hypot(dx, dz);
          if (dist < nearestDist) nearestDist = dist;

          en.root.lookAt(playerPos.x, en.root.position.y, playerPos.z);

          // Weeping-Angel Watcher freezes when inside player's flashlight beam
          let frozen = false;
          if (en.type === 'WATCHER' && state.battery > 12) {
            const toEnX = -dx / (dist || 1);
            const toEnZ = -dz / (dist || 1);
            const dot = lookDirX * toEnX + lookDirZ * toEnZ;
            if (dot > 0.82 && dist < 28) frozen = true;
          }

          if (!frozen && state.countdown <= 0) {
            en.root.position.x += (dx / (dist || 1)) * en.speed * dt;
            en.root.position.z += (dz / (dist || 1)) * en.speed * dt;
            en.walkPhase += dt * en.speed * 3.1;

            if (en.type !== 'BAT') {
              resolveCircleColliders(en.root.position, en.type === 'BRUTE' ? 0.72 : 0.45);
              const swing = Math.sin(en.walkPhase) * 0.55;
              if (en.animParts.legL) en.animParts.legL.rotation.x = swing;
              if (en.animParts.legR) en.animParts.legR.rotation.x = -swing;
              if (en.animParts.armL) en.animParts.armL.rotation.x = swing * 0.35;
              if (en.animParts.armR) en.animParts.armR.rotation.x = -swing * 0.35;
              if (en.animParts.head) en.animParts.head.rotation.z = Math.sin(en.walkPhase * 0.5) * 0.12;
            } else {
              en.root.position.y = 1.75 + Math.sin(elapsed * 6 + i) * 0.35;
              if (en.animParts.wingL) {
                const flap = Math.sin(elapsed * 18) * 0.55;
                en.animParts.wingL.rotation.z = flap;
                en.animParts.wingR.rotation.z = -flap;
              }
            }

            en.stepTimer -= dt;
            if (en.stepTimer <= 0) {
              en.stepTimer = en.type === 'HOUND' ? 0.28 : (en.type === 'BRUTE' ? 0.58 : 0.46);
              audio.playSpatialEntityStep(en.type, en.root.position.x, en.root.position.z);
              if (en.type === 'BRUTE' && dist < 14) {
                state.screenShake = Math.max(state.screenShake, 0.045);
              }
            }
          }

          en.groanTimer -= dt;
          if (en.groanTimer <= 0) {
            en.groanTimer = 3.5 + Math.random() * 4.5;
            audio.playSpatialGroan(en.type, en.root.position.x, en.root.position.z);
          }

          if (en.attackCooldown > 0) en.attackCooldown -= dt;
          const reach = en.type === 'BRUTE' ? 2.05 : 1.55;
          if (dist < reach && en.attackCooldown <= 0 && state.countdown <= 0) {
            en.attackCooldown = 1.15;
            state.hp = Math.max(0, state.hp - (en.type === 'BRUTE' ? 28 : 18));
            state.screenShake = en.type === 'BRUTE' ? 0.22 : 0.14;
            updateHUD();

            // Directional Red Screen Edge Flash
            const rightX = Math.cos(state.yaw);
            const rightZ = -Math.sin(state.yaw);
            const sideDot = (-dx * rightX + -dz * rightZ);
            const frontDot = (-dx * lookDirX + -dz * lookDirZ);
            if (frontDot < -0.2) {
              hitBack.style.opacity = '1';
              setTimeout(() => { hitBack.style.opacity = '0'; }, 220);
            } else if (sideDot < 0) {
              hitLeft.style.opacity = '1';
              setTimeout(() => { hitLeft.style.opacity = '0'; }, 220);
            } else {
              hitRight.style.opacity = '1';
              setTimeout(() => { hitRight.style.opacity = '0'; }, 220);
            }

            if (state.hp <= 0) {
              openMenu('DEAD', 'RETRY', true);
              return;
            }
          }
        }

        // Panic Heartbeat & Vignette
        const panic = Math.max(0, Math.min(1, (16 - nearestDist) / 14));
        panicVignette.style.opacity = String(panic * 0.78);
        if (panic > 0.15) {
          state.heartbeatTimer -= dt;
          if (state.heartbeatTimer <= 0) {
            state.heartbeatTimer = Math.max(0.32, 0.85 - panic * 0.48);
            audio.playHeartbeat(panic);
          }
        }

        updateHUD();
        renderRadarMap();
      }

      function renderSceneFrame() {
        const dt = Math.min(clock.getDelta(), 0.05);
        updateSimulation(dt);
        renderer.render(scene, camera);
      }

      window.addEventListener('load', () => {
        equipPistol(0);
        applyCrosshair(0);
        loadStage(1);
        enforceLandscapeOnMobile();
        openMenu('', 'START', false);
        renderer.setAnimationLoop(renderSceneFrame);
      });
    })();
  </script>
</body>
